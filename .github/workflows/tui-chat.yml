name: TUI chat

on:
  pull_request:
  push:
    branches: [main, feat/tui-chat-bhalu-agent]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          version: '0.9.16'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tui-chat-agent/tests -p 'test_*.py' -v
      - run: bun install --frozen-lockfile
        working-directory: tui-chat-agent
      - run: bun run typecheck
        working-directory: tui-chat-agent
      - run: bun test
        working-directory: tui-chat-agent
